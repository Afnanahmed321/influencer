<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Browse by Category</title>
    <link rel="stylesheet" href="../../Assets/Fonts/gilroy.css" />
    <link rel="stylesheet" href="catories.css" />
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; font-family: "Gilroy", ui-sans-serif, system-ui, sans-serif; }
    </style>
  </head>
  <body>
    <section class="category-section" aria-labelledby="category-title">
      <div class="category-eyebrow">Browse by category</div>
      <h2 id="category-title">Explore services by <span>niche</span></h2>
      <p>From fashion to tech, find creators who speak your audience's language.</p>
      <div class="category-grid" aria-label="Popular service categories">
        <a class="category-card category-daily-vlogs" href="#services"><span class="category-content"><span class="category-name">Daily Vlogs</span></span></a>
        <a class="category-card art-doctor" href="#services"><span class="category-content"><span class="category-name">Wellness</span></span></a>
        <a class="category-card art-moving" href="#services"><span class="category-content"><span class="category-name">Travel</span></span></a>
        <a class="category-card art-salon" href="#services"><span class="category-content"><span class="category-name">Beauty</span></span></a>
        <a class="category-card art-pest" href="#services"><span class="category-content"><span class="category-name">Skincare</span></span></a>
        <a class="category-card art-electrician" href="#services"><span class="category-content"><span class="category-name">Makeup</span></span></a>
        <a class="category-card art-tutor" href="#services"><span class="category-content"><span class="category-name">Haircare</span></span></a>
        <a class="category-card art-plumber" href="#services"><span class="category-content"><span class="category-name">Tech</span></span></a>
        <a class="category-card art-electrician" href="#services"><span class="category-content"><span class="category-name">Gadgets</span></span></a>
        <a class="category-card art-moving" href="#services"><span class="category-content"><span class="category-name">Lifestyle</span></span></a>
      </div>
    </section>
  </body>
</html>
